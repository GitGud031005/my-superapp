services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: superapp
      POSTGRES_USER: superapp
      POSTGRES_PASSWORD: superapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superapp -d superapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [full]
    build:
      context: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/superapp
      SPRING_DATASOURCE_USERNAME: superapp
      SPRING_DATASOURCE_PASSWORD: superapp
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: [full]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8088:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
