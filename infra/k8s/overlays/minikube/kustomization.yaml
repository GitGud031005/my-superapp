apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: superapp
labels:
  - pairs:
      app.kubernetes.io/part-of: superapp
    includeSelectors: false
resources:
  - ../../base
  - postgres.yaml
secretGenerator:
  - name: backend-db
    envs:
      - secrets.env
images:
  - name: superapp-backend
    newName: superapp-backend
    newTag: dev
  - name: superapp-web
    newName: superapp-web
    newTag: dev
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Service
      name: web
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
