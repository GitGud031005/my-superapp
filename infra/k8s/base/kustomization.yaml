apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: superapp
labels:
  - pairs:
      app.kubernetes.io/part-of: superapp
    includeSelectors: false
resources:
  - namespace.yaml
  - backend.yaml
  - web.yaml
configMapGenerator:
  - name: backend-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/superapp
