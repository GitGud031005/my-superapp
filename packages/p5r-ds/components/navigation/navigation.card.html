<html class="p5r-scope">
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../assets/brand/phantom-thieves-logo.png">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../_ds_bundle.jsx"></script>
<div id="root" style="background:var(--surface-canvas);color:var(--text-on-dark);font-family:var(--font-body);padding:32px;box-sizing:border-box"></div>
<script type="text/babel">
const { MenuList } = window.PersonaFiveRoyalDS;
function Demo(){
  const [sel, setSel] = React.useState('item');
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:48,alignItems:'flex-start'}}>
      <MenuList label="Main menu" value={sel} onChange={setSel} items={[
        {id:'skill',label:'Skill'},{id:'item',label:'Item',meta:'x12'},{id:'persona',label:'Persona'},{id:'config',label:'Config',disabled:true}]} />
      <p style={{maxWidth:260,color:'var(--text-muted-on-dark)',lineHeight:1.55}}>Focus the list, then use Up, Down, Home and End. Selected: <b style={{color:'var(--white)'}}>{sel}</b></p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
