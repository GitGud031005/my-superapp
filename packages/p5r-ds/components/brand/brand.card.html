<!-- @dsCard group="Components" viewport="760x640" name="Brand" subtitle="RansomTitle, TarotCard, CallingCard" -->
<html class="p5r-scope">
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../assets/brand/phantom-thieves-logo.png">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../_ds_bundle.jsx"></script>
<div id="root" style="background:var(--surface-canvas);color:var(--text-on-dark);font-family:var(--font-body);padding:32px;box-sizing:border-box"></div>
<script type="text/babel">
const { RansomTitle, TarotCard, CallingCard, Button } = window.PersonaFiveRoyalDS;
function Demo(){
  const [back, setBack] = React.useState(false);
  const [flipped, setFlipped] = React.useState(false);
  const [seed, setSeed] = React.useState(0);
  return (
    <div style={{display:'grid',gap:32}}>
      <RansomTitle as="h1" text="Take your heart" skin="logo" size={64} seed={seed} />
      <div style={{display:'flex',gap:28,alignItems:'center',flexWrap:'wrap'}}>
        <TarotCard index={7} name="Tarot card 7" tilt="-4deg" height={240} back={back} onFlip={()=>setBack(!back)} />
        <TarotCard index={12} name="Tarot card 12" tilt="3deg" height={240} />
        <div style={{display:'grid',gap:12}}>
          <Button size="sm" onClick={()=>setSeed(seed+1)}>Shuffle letters</Button>
          <Button size="sm" variant="dark" onClick={()=>setFlipped(!flipped)}>Flip calling card</Button>
        </div>
      </div>
      <CallingCard to="The Distorted King of Procrastination," body="You hoard unfinished projects in endless open tabs and call it planning. We will steal your distorted desire." flipped={flipped} onFlip={()=>setFlipped(!flipped)} seed={seed} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
