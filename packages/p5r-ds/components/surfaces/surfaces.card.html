<html class="p5r-scope">
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../assets/brand/phantom-thieves-logo.png">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../_ds_bundle.jsx"></script>
<div id="root" style="background:var(--surface-canvas);color:var(--text-on-dark);font-family:var(--font-body);padding:32px;box-sizing:border-box"></div>
<script type="text/babel">
const { Panel, Banner, SpeechBubble, DateSticker, Dialog, Button } = window.PersonaFiveRoyalDS;
function Demo(){
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{display:'grid',gap:36}}>
      <div style={{display:'flex',gap:32,flexWrap:'wrap',alignItems:'center'}}>
        <Banner as="h2">Targets: 2</Banner>
        <Banner tone="black" tilt="1deg">Mementos</Banner>
        <DateSticker month={11} day={16} weekday="Monday" period="After school" />
      </div>
      <div style={{display:'flex',gap:32,flexWrap:'wrap',alignItems:'flex-start'}}>
        <SpeechBubble speaker="Morgana" tailX={30}>We should steal that heart before Friday.</SpeechBubble>
        <Panel title="Mission" tilt="-1.5deg" style={{width:240}}>Steal the heart before the deadline.</Panel>
        <Panel tone="light" style={{width:200}}>Readable body copy sits on a light panel.</Panel>
      </div>
      <div><Button variant="primary" onClick={()=>setOpen(true)}>Open dialog</Button></div>
      <Dialog open={open} title="Send the card?" onClose={()=>setOpen(false)}
        actions={<><Button onClick={()=>setOpen(false)}>Cancel</Button><Button variant="primary" onClick={()=>setOpen(false)}>Send the card</Button></>}>
        The target will receive it tomorrow.
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
