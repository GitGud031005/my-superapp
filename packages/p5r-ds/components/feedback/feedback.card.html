<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<div id="root" style="background:var(--surface-canvas);color:var(--text-on-dark);font-family:var(--font-body);padding:32px;box-sizing:border-box"></div>
<script type="text/babel">
const { AwardToast, StatBar } = window.PersonaFiveRoyalDS;
function Demo(){
  return (
    <div style={{display:'grid',gap:28,maxWidth:460}}>
      <AwardToast title="Target stolen" icon="../../assets/glyphs/btn-08.png">Procrastination was cleared.</AwardToast>
      <div style={{display:'grid',gap:16}}>
        <StatBar label="HP" value={120} max={200} />
        <StatBar label="SP" value={48} max={90} kind="sp" />
        <StatBar label="Support" value={62} max={100} kind="progress" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
