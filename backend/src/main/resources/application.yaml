server:
  port: ${PORT:8080}

spring:
  application:
    name: superapp
  docker:
    compose:
      file: ../infra/compose.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
