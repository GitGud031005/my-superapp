server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: superapp
  config:
    import: optional:file:../.env[.properties]
  docker:
    compose:
      file: ../infra/compose.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
  session:
    timeout: 14d
    jdbc:
      table-name: identity.spring_session
      initialize-schema: never
      cleanup-cron: "-"

ledger:
  admin-emails: ${LEDGER_ADMIN_EMAILS:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
