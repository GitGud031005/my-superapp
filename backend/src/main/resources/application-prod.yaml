server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  docker:
    compose:
      enabled: false
  main:
    lazy-initialization: true
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
